spring.application.name=dockerized
server.servlet.context-path=/api/v1

# Configuración de la conexión a PostgreSQL (lee de variables de entorno)
spring.datasource.url=jdbc:${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Configuración adicional de Hibernate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
# 'validate' es más seguro para producción. Usa 'update' o 'create' solo en desarrollo.
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# COnfiguración para notificaciones por email
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:proyect2024up@gmail.com}
spring.mail.password=${MAIL_PASSWORD:cuxo qtik dspw syqt}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
logging.level.org.springframework.mail=DEBUG

# Configuración para manejo de archivos
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Configuración AWS (lee de variables de entorno)
aws.region=${AWS_REGION:us-east-1}
aws.accessKeyId=${AWS_ACCESS_KEY_ID}
aws.secretKey=${AWS_SECRET_KEY}

# URL del bridge de WhatsApp
wppconnect.base.url=${WPPCONNECT_BASE_URL}

# Orígenes permitidos para CORS (separados por coma)
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}

logging.level.org.springframework.web=${LOG_LEVEL_SPRING_WEB:INFO}
logging.level.org.hibernate.SQL=${LOG_LEVEL_HIBERNATE_SQL:INFO}
logging.level.org.springframework.security=${LOG_LEVEL_SPRING_SECURITY:INFO}