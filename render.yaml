# Blueprint para desplegar en Render
databases:
  - name: paygrid-postgres
    region: oregon
    plan: free

services:
  - type: web
    name: backend-app
    region: oregon
    plan: free
    env: docker
    dockerContext: .
    dockerfilePath: ./Dockerfile
    healthCheck:
      path: /actuator/health
      timeoutSeconds: 600
    envVars:
      - key: DB_URL # <-- CAMBIADO: Spring Boot prefiere una URL completa
        fromDatabase:
          name: paygrid-postgres
          property: connectionString
      - key: DB_USERNAME
        fromDatabase:
          name: paygrid-postgres
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: paygrid-postgres
          property: password
      - key: WPPCONNECT_BASE_URL
        value: http://whatsapp-bridge:21465 # <-- CORREGIDO: Render inyecta el puerto correcto automáticamente
      - key: DDL_AUTO
        value: update
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_KEY
        sync: false
      - key: MAIL_PASSWORD
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false

  - type: web # <-- AÑADIDO: El servicio de WhatsApp que faltaba
    name: whatsapp-bridge
    region: oregon
    plan: free
    env: node
    rootDir: ./whatsapp-bridge # <-- Le dice a Render que trabaje en esta carpeta
    buildCommmand: npm install
    startCommand: node server.js
    healthCheck:
      path: /api/status # <-- Asumiendo que tienes una ruta de status, si no, elimínalo
