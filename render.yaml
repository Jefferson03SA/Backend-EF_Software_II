# Blueprint para desplegar en Render
databases:
  - name: paygrid-postgres
    region: oregon
    plan: free

services:
  - type: web
    name: backend-app
    region: oregon
    plan: free
    env: docker
    dockerContext: .
    dockerfilePath: ./Dockerfile
    healthCheckPath: /actuator/health
    envVars:
      - key: DB_URL
        fromDatabase:
          name: paygrid-postgres
          property: connectionString
      - key: DB_USERNAME
        fromDatabase:
          name: paygrid-postgres
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: paygrid-postgres
          property: password
      - key: WPPCONNECT_BASE_URL
        value: http://whatsapp-bridge:21465
      - key: DDL_AUTO
        value: update
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_KEY
        sync: false
      - key: MAIL_PASSWORD
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false

  - type: web
    name: whatsapp-bridge
    region: oregon
    plan: free
    env: node
    rootDir: ./whatsapp-bridge
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /api/status