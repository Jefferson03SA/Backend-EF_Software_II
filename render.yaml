# Blueprint para desplegar en Render
# Documentación: https://render.com/docs/blueprint-spec
databases:
  - name: paygrid-postgres
    region: oregon
    plan: free

services:
  - type: web
    name: whatsapp-bridge
    region: oregon
    plan: free
    env: docker
    dockerContext: ./whatsapp-bridge
    dockerfilePath: ./whatsapp-bridge/Dockerfile
  
  - type: web
    name: backend-app
    region: oregon
    plan: free
    env: docker
    dockerContext: .
    dockerfilePath: ./Dockerfile
    healthCheck: # <-- CORRECCIÓN: anidado aquí
      path: /actuator/health # <-- CORRECCIÓN: ahora es 'path'
      timeoutSeconds: 600 # <-- CORRECCIÓN: ahora es 'timeoutSeconds'
    # La línea 'httpPort: 8080' se ha eliminado
    envVars:
      - key: DB_HOST
        fromDatabase:
          name: paygrid-postgres
          property: host
      - key: DB_PORT
        fromDatabase:
          name: paygrid-postgres
          property: port
      - key: DB_NAME
        fromDatabase:
          name: paygrid-postgres
          property: database
      - key: DB_USERNAME
        fromDatabase:
          name: paygrid-postgres
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: paygrid-postgres
          property: password
      - key: WPPCONNECT_BASE_URL
        value: http://whatsapp-bridge:21465/api
      - key: DDL_AUTO
        value: update
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_KEY
        sync: false
      - key: MAIL_PASSWORD
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false